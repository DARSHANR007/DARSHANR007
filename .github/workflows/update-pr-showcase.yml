
      - name: Commit README changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "README is already up to date."
            exit 0
          fi

          git commit -m "chore: update PR showcase"

          # Retry if another commit reaches main concurrently.
          for attempt in 1 2 3; do
            git fetch origin main

            if ! git rebase origin/main; then
              git rebase --abort
              echo "Rebase failed; retrying..."
              sleep 2
              continue
            fi

            if git push origin HEAD:main; then
              echo "README showcase pushed successfully."
              exit 0
            fi

            echo "Push attempt $attempt failed; retrying..."
            sleep 2
          done

          echo "Could not push after 3 attempts."
          exit 1
