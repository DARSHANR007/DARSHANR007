
name: Update PR Showcase

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: update-pr-showcase
  cancel-in-progress: false

jobs:
  update-showcase:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate PR showcase
        env:
          GITHUB_USERNAME: DARSHANR007
          MAX_PRS: "12"
        run: python scripts/update_pr_showcase.py

      - name: Commit README changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "README is already up to date."
            exit 0
          fi

          git commit -m "chore: update PR showcase"

          # Rebase onto the latest main, retrying if it moves.
          for attempt in 1 2 3; do
            git fetch origin main

            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "README showcase pushed successfully."
                exit 0
              fi
            else
              git rebase --abort || true
              echo "Rebase failed; regenerating README from latest main."

              git fetch origin main
              git reset --hard origin/main
              python scripts/update_pr_showcase.py
              git add README.md

              if git diff --cached --quiet; then
                echo "README is already up to date."
                exit 0
              fi

              git commit -m "chore: update PR showcase"
            fi

            echo "Attempt $attempt failed; retrying..."
            sleep 2
          done

          echo "Could not update README after 3 attempts."
          exit 1
